name: PR Test
on:
  push:
    branches:
      - main
      - development
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.package.name }}, ${{ matrix.os }}, Dart ${{ matrix.sdk }})
    # The development push already validates the exact promotion SHA. Keep
    # feature PR and merge-queue validation while avoiding duplicate runners.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       !(github.event.pull_request.base.ref == 'main' &&
         github.event.pull_request.head.ref == 'development' &&
         github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [minimum, stable, beta]
        package:
          - name: server
            path: packages/openfeature_dart_server_sdk
            minimum_sdk: 3.12.2
          - name: client
            path: packages/openfeature_dart_client_sdk
            minimum_sdk: 3.10.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk == 'minimum' && matrix.package.minimum_sdk || matrix.sdk }}

      - name: Install dependencies
        working-directory: ${{ matrix.package.path }}
        run: dart pub get

      - name: Analyze
        working-directory: ${{ matrix.package.path }}
        run: dart analyze

      - name: Run tests
        working-directory: ${{ matrix.package.path }}
        run: dart test

      - name: Compile client web smoke target
        if: matrix.package.name == 'client'
        working-directory: ${{ matrix.package.path }}
        shell: bash
        run: |
          mkdir -p build
          dart compile js test/web_compile_smoke.dart -o build/web_compile_smoke.js

      - name: Run client web smoke target in Chrome
        if: >-
          matrix.package.name == 'client' &&
          matrix.os == 'ubuntu-latest' &&
          matrix.sdk == 'minimum'
        working-directory: ${{ matrix.package.path }}
        run: dart test -p chrome test/web_compile_smoke.dart

  stable-required:
    name: test (ubuntu-latest, stable)
    needs: test
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.draft == false &&
        !(github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.ref == 'development' &&
          github.event.pull_request.head.repo.full_name == github.repository)))
    runs-on: ubuntu-latest
    steps:
      - name: Verify test matrix
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: test "$MATRIX_RESULT" = success

  minimum-dependencies:
    name: minimum dependencies (${{ matrix.package.name }})
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       !(github.event.pull_request.base.ref == 'main' &&
         github.event.pull_request.head.ref == 'development' &&
         github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: server
            path: packages/openfeature_dart_server_sdk
            sdk: 3.12.2
          - name: client
            path: packages/openfeature_dart_client_sdk
            sdk: 3.10.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.package.sdk }}

      - name: Install minimum dependencies
        working-directory: ${{ matrix.package.path }}
        run: dart pub downgrade

      - name: Analyze
        working-directory: ${{ matrix.package.path }}
        run: dart analyze

      - name: Run tests
        working-directory: ${{ matrix.package.path }}
        run: dart test

      - name: Compile client web smoke target
        if: matrix.package.name == 'client'
        working-directory: ${{ matrix.package.path }}
        shell: bash
        run: |
          mkdir -p build
          dart compile js test/web_compile_smoke.dart -o build/web_compile_smoke.js

      - name: Run client web smoke target in Chrome
        if: matrix.package.name == 'client'
        working-directory: ${{ matrix.package.path }}
        run: dart test -p chrome test/web_compile_smoke.dart
