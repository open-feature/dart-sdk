# This workflow validates that branch and commit names are standardized.

name: Validation Workflow

on:
  workflow_call: # Makes the workflow reusable
    inputs:
      branch_name:
        required: true
        type: string

jobs:
  validate-branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest
    steps:
      - name: Validate Branch Name
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
        run: |
          set -euo pipefail
          echo "Validating branch name..."
          echo "Branch name: $BRANCH_NAME"

          if [[ "$BRANCH_NAME" =~ ^(development|main|release-please--branches--main--components--(openfeature_dart_server_sdk|openfeature_dart_client_sdk))$ ]]; then
            echo "✅ Branch name '$BRANCH_NAME' is valid for a long-lived branch."
          elif [[ "$BRANCH_NAME" =~ ^dependabot/github_actions/development/[A-Za-z0-9._/-]+$ ]]; then
            echo "✅ Branch name '$BRANCH_NAME' is valid for a Dependabot GitHub Actions update."
          elif [[ "$BRANCH_NAME" =~ ^(feat|fix|hotfix|chore|test|refactor|release|admin|docs|ci)/[a-z0-9._-]+$ ]]; then
            echo "✅ Branch name '$BRANCH_NAME' follows the naming convention."
          else
            echo "❌ Branch name '$BRANCH_NAME' does not follow the naming convention: <type>/<branch-name>"
            echo "Valid types: feat, fix, hotfix, chore, test, refactor, release, admin, docs, ci, main, development"
            exit 1
          fi

  validate-commit-messages:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate Commit Messages
        run: |
          set -euo pipefail
          echo "Validating commit messages..."

          # Define the regex for conventional commit format
          REGEX="^(feat|fix|hotfix|chore|test|refactor|release|admin|docs|ci)(\([a-z0-9_-]+\))?: .{1,72}$"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
            git fetch origin "$BASE_BRANCH"
            COMMIT_RANGE="origin/$BASE_BRANCH..HEAD"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BEFORE_SHA="${{ github.event.before }}"
            AFTER_SHA="${{ github.sha }}"
            if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              COMMIT_RANGE="$AFTER_SHA^..$AFTER_SHA"
            else
              COMMIT_RANGE="$BEFORE_SHA..$AFTER_SHA"
            fi
          else
            COMMIT_RANGE="HEAD^..HEAD"
          fi
          echo "Commit range: $COMMIT_RANGE"

          # Extract all commit messages excluding auto-generated ones
          INVALID_COMMITS=$(git log --no-merges "$COMMIT_RANGE" --pretty=format:"%s" \
            | grep -vE "^(Merge pull request|Initial commit)" \
            | grep -vE "^(Merge remote-tracking branch|Merge pull request)" \
            | grep -vE "^(Merge branch|DCO Remediation|Signed-off-by)" \
            | grep -vE "$REGEX" || true)

          # Check if there are invalid commit messages
          if [[ -n "$INVALID_COMMITS" ]]; then
            echo "❌ The following commit messages do not follow the convention:"
            echo "$INVALID_COMMITS"
            echo ""
            echo "Commit message format must follow:"
            echo "<type>(<scope>): <short summary>"
            echo "Examples:"
            echo "  feat(auth): add OAuth 2.0 support"
            echo "  fix(payment): resolve rounding error in total calculation"
            exit 1
          else
            echo "✅ All developer-made commit messages follow the convention."
          fi

  validate-dart-sdk-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Dart SDK versions in all pubspec.yaml files
        run: |
          echo "Validating Dart SDK versions in all pubspec.yaml files..."

          # Find all pubspec.yaml files (recursively)
          PUBSPEC_FILES=$(find . -name "pubspec.yaml")
          echo "Found the following pubspec.yaml files:"
          echo "$PUBSPEC_FILES"

          declare -A EXPECTED_MINIMUM_VERSIONS=(
            ["./pubspec.yaml"]="3.12.2"
            ["./packages/openfeature_dart_server_sdk/pubspec.yaml"]="3.12.2"
            ["./packages/openfeature_dart_client_sdk/pubspec.yaml"]="3.10.0"
            ["./conformance/client_provider_contract/pubspec.yaml"]="3.10.0"
          )
          ALL_VALID="true"

          # Iterate over each pubspec.yaml file
          for PUBSPEC in $PUBSPEC_FILES; do
            echo "Checking $PUBSPEC..."

            EXPECTED_MINIMUM_VERSION="${EXPECTED_MINIMUM_VERSIONS[$PUBSPEC]:-}"
            if [ -z "$EXPECTED_MINIMUM_VERSION" ]; then
              echo "❌ No expected minimum Dart SDK version is configured for $PUBSPEC."
              ALL_VALID="false"
              continue
            fi

            # Extract the lower bound from ^<version> or >=<version>.
            SDK_VERSION=$(sed -nE "s/^[[:space:]]+sdk:[[:space:]]*['\"]?(\^|>=)([0-9]+\.[0-9]+\.[0-9]+).*/\2/p" "$PUBSPEC")
            SDK_VERSION="${SDK_VERSION:-not_found}"
            echo "Extracted Dart SDK version from $PUBSPEC: $SDK_VERSION"

            # Validate the extracted version
            if [ "$SDK_VERSION" = "not_found" ]; then
              echo "❌ Failed to extract Dart SDK version from $PUBSPEC. Ensure the file contains a valid 'sdk: ^<version>' entry."
              ALL_VALID="false"
              continue
            fi

            if [ "$SDK_VERSION" != "$EXPECTED_MINIMUM_VERSION" ]; then
              echo "❌ Dart SDK version in $PUBSPEC must start at $EXPECTED_MINIMUM_VERSION, found $SDK_VERSION"
              ALL_VALID="false"
            else
              echo "✅ Dart SDK version in $PUBSPEC is satisfactory: $SDK_VERSION"
            fi
          done

          # Exit with failure if any pubspec.yaml file has an invalid version
          if [ "$ALL_VALID" != "true" ]; then
            echo "❌ One or more pubspec.yaml files have an invalid Dart SDK version."
            exit 1
          else
            echo "✅ All pubspec.yaml files have a valid Dart SDK version."
          fi
