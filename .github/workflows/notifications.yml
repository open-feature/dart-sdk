name: Notifications

on:
  push:
    branches:
      - main
      - development

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
    
    steps:
      - name: Notify Google Chat
        uses: SimonScholz/google-chat-action@f75e2f4f5539eaa09e879f1aac16c0f7d4e779d4
        with:
          webhookUrl: '${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}'
